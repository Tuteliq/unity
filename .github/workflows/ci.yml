name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate package.json
        run: python3 -c "import json; json.load(open('package.json'))"

      - name: Check required files
        run: |
          files=("README.md" "LICENSE.md" "CHANGELOG.md" "Runtime/Tuteliq.Runtime.asmdef")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      # Unity ignores assets without a .meta file in a package installed from git.
      # Every tracked file needs one, and so does every folder above it, except
      # paths with a component that starts with "." or ends with "~" (Unity skips those).
      - name: Check .meta files
        run: |
          git ls-files | grep -v '\.meta$' | grep -Ev '(^|/)(\.[^/]*|[^/]*~)(/|$)' | while read -r path; do
            echo "$path"
            dir=$(dirname "$path")
            while [ "$dir" != "." ]; do
              echo "$dir"
              dir=$(dirname "$dir")
            done
          done | sort -u > "$RUNNER_TEMP/needs-meta.txt"
          missing=0
          while read -r item; do
            if [ ! -f "$item.meta" ]; then
              echo "Missing $item.meta"
              missing=1
            fi
          done < "$RUNNER_TEMP/needs-meta.txt"
          [ "$missing" -eq 0 ] || exit 1
          echo "All .meta files present"

      - name: Validate assembly definitions
        run: |
          for asmdef in $(find . -name "*.asmdef"); do
            echo "Validating $asmdef"
            python3 -c "import json; json.load(open('$asmdef'))"
          done

      # Compiles every Runtime script with C# 9 (what Unity 2021.3 accepts)
      # against compile-only UnityEngine stubs in .ci/Runtime/UnityStubs.
      - name: Build Runtime scripts
        run: dotnet build .ci/Runtime/Tuteliq.Runtime.csproj --configuration Release

      # WebGL has no timer threads, so it takes a different retry wait.
      - name: Build Runtime scripts for WebGL
        run: dotnet build .ci/Runtime/Tuteliq.Runtime.csproj --configuration Release -p:DefineConstants=UNITY_WEBGL --no-incremental

      # Runs Tests/Runtime with NUnit. Requests go to a fake transport; nothing is sent.
      - name: Run tests
        run: dotnet test .ci/Tests/Tuteliq.Tests.csproj --configuration Release --logger "console;verbosity=normal"
